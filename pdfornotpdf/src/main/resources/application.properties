spring.application.name=PDForNotPDF
server.address=0.0.0.0
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# PDF output directory

# Sessione solo via cookie: niente ;jsessionid negli URL di redirect
server.servlet.session.tracking-modes=cookie

# ===== Release remote (Gitea): flusso bozza → candidate → PR → release =====
# Vuoto = funzionamento solo locale con approvazione in-app
# NOTA (audit 03 / S6): un remote http:// viaggia in chiaro (basic auth base64) — accettabile
# solo per Gitea locale; per un remote remoto usare HTTPS (o un remote SSH).
app.release.remote.url=http://localhost:3000/pdforCurrent/stampe-releases.git
app.release.remote.api=http://localhost:3000/api/v1
app.release.remote.user=pdforCurrent
# credenziali via variabile d'ambiente (mai nel repo): export GITEA_PASSWORD=…
# setup locale: docker/gitea/setup-gitea.sh le salva in docker/gitea/.credentials
app.release.remote.password=${GITEA_PASSWORD:}
app.release.remote.pr-auto=true
app.release.sync-interval-ms=30000

# ===== Assistente LLM (endpoint OpenAI-compatibile: OpenAI/OpenRouter/Ollama/…) =====
app.llm.enabled=false
app.llm.base-url=
app.llm.api-key=
app.llm.model=
